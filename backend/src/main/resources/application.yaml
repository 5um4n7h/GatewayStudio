server:
  port: 8080
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: gateway-studio

  threads:
    virtual:
      enabled: true

  # Database Configuration (environment-based, defaults for local dev)
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/gateway_studio
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20

  # Flyway Migrations (optional - disabled if using Hibernate DDL)
  flyway:
    enabled: false

spring.cloud.gateway.mvc:
  enabled: true

# Deployment mode and backend URL (configurable)
deployment: ${DEPLOYMENT:local}
backend:
  public-url: ${BACKEND_URL:http://localhost:8080}

# Logging Configuration
logging:
  level:
    root: WARN
    com.gatewaystudio: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
