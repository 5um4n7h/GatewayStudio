server:
  port: 8080
  # Enable Virtual Threads for Java 21+ / Java 25 concurrency
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: gateway-studio

  # Enable Virtual Threads globally
  threads:
    virtual:
      enabled: true

  # Database Configuration (Docker PostgreSQL)
  datasource:
    # Use "localhost" if running app on host machine.
    # Change "localhost" to your docker service name (e.g., "postgres") if running inside Docker network.
    url: jdbc:postgresql://localhost:5432/gateway_db
    username: gateway_user
    password: gateway_password
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate # Database schema managed strictly by Flyway
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Spring Cloud Gateway MVC Configuration
spring.cloud.gateway.mvc:
  enabled: true

logging:
  level:
    root: INFO
    com.gatewaystudio: INFO
